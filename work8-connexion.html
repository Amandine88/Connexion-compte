<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace membre : connexion</title>
    <link rel="stylesheet" href="work8-connexion.css"/>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle"/>
  </head>
  <body>
    <div class="conteneur-connexion">
      <div class="formulaire-connexion">
        <div class="icone">
          <span class="material-symbols-outlined"> account_circle </span>
        </div>
        <h2>Se connecter</h2>
        <form action="" id="mon-formulaire">
          <label for="email">Email : </label>
          <input class="champ" type="email" name="email" id="email" />
          <br />
          <br />
          <label for="mot-de-passe">Votre mot de passe : </label>
          <input
            class="champ"
            type="password"
            name="mot de passe"
            id="mot-de-passe"
          />
          <br />
          <label
            ><input type="checkbox" name="souvenir de moi" />Se souvenir de
            moi</label
          ><br />
          <br />
          <input class="connexion" type="submit" value="connexion" />
        </form>
        <div class="lien">
          <a href="#">Mot de passe oublié ?</a>
          <a href="#">Créer un compte</a>
        </div>
      </div>
    </div>
  </body>
</html>
